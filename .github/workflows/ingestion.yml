name: StockSense n8n ingestion
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to refresh
        type: choice
        options: [all, India, US]
        default: all
  schedule:
    # 12:23 UTC = 17:53 IST, after BSE close. 22:23 UTC is after US close in both DST seasons.
    - cron: '23 12 * * 1-5'
    - cron: '23 22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stocksense-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      INGEST_MARKET: ${{ github.event.inputs.market || (github.event.schedule == '23 12 * * 1-5' && 'India' || 'US') }}
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      N8N_USER_FOLDER: ${{ runner.temp }}/stocksense-n8n
      N8N_BIN: ${{ github.workspace }}/automation/n8n-docker.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required fields without revealing values
        shell: bash
        run: |
          test -n "$BACKEND_URL"
          test -n "$INGESTION_TOKEN"
          test -n "$GROQ_API_KEY"
      - name: Pull official pinned n8n Community Edition
        run: docker pull docker.n8n.io/n8nio/n8n:2.48.7
      - run: chmod +x automation/n8n-docker.sh
      - name: Import and execute real workflow
        run: python automation/run_n8n.py
      - name: Remove ephemeral runner state
        if: always()
        shell: bash
        run: |
          case "$N8N_USER_FOLDER" in "$RUNNER_TEMP"/*) rm -rf -- "$N8N_USER_FOLDER" ;; *) exit 1 ;; esac
