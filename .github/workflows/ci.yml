name: Pilot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: Checks to run
        type: choice
        options: [all, n8n]
        default: all
permissions:
  contents: read
jobs:
  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.component != 'n8n'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VAC project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: VAC project/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    if: github.event_name != 'workflow_dispatch' || inputs.component != 'n8n'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
  database:
    if: github.event_name != 'workflow_dispatch' || inputs.component != 'n8n'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm ci --no-audit --no-fund
      - run: npm test
  actual-n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull official pinned n8n Community image
        run: docker pull docker.n8n.io/n8nio/n8n:2.48.7
      - run: chmod +x automation/n8n-docker.sh
      - run: node automation/test-workflow-code.mjs
      - name: Verify actual CLI against isolated fixtures (no live DB/API claims)
        run: python automation/test_workflow.py
        env:
          N8N_BIN: ${{ github.workspace }}/automation/n8n-docker.sh
